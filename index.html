<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>打刻アプリ</title>
  <!-- Firebase SDK (compat版) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; background: #f5f5f5; font-family: sans-serif; color: #333; }
    #topBar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; background: white; border-bottom: 1px solid #eee; }
    #topBar .spacer { margin-left: auto; }
    #userInfo { display: flex; align-items: center; gap: 8px; margin-right: 16px; }
    #userInfo.hidden { display: none; }
    #userDisplayName { font-size: 14px; color: #666; }
    #userAvatar { width: 32px; height: 32px; border-radius: 50%; background: #2e9e5b; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    #logoutBtn { border: none; background: #e0e0e0; color: #444; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    #devBadge { display: none; background: #e0a83e; color: white; font-size: 15px; font-weight: bold; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
    #devBadge.show { display: inline-block; }
    #devOffBtn { display: none; background: #c0392b; color: white; font-size: 14px; padding: 8px 14px; border: none; border-radius: 20px; cursor: pointer; }
    #devOffBtn.show { display: inline-block; }
    #settingsBtn { border: none; background: #e6e6e6; color: #444; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

    /* ステータス表示 */
    #statusBar { text-align: center; padding: 8px 16px; background: #f0f0f0; border-bottom: 1px solid #ddd; font-size: 14px; }
    #statusBar.working { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
    #statusBar.away { background: #fff3e0; color: #e65100; font-weight: bold; }
    #statusBar.done { background: #f3e5f5; color: #6a1b9a; font-weight: bold; }
    #statusBar.notStarted { background: #fce4ec; color: #880e4f; font-weight: bold; }

    /* ログイン画面 */
    #loginView { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: none; align-items: center; justify-content: center; z-index: 200; }
    #loginView.show { display: flex; }
    #loginBox { background: white; border-radius: 14px; padding: 40px; width: 360px; max-width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.25); text-align: center; }
    #loginBox h1 { margin: 0 0 8px; font-size: 28px; color: #333; }
    #loginBox .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
    #googleLoginBtn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: white; color: #333; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #ddd; }
    #googleLoginBtn:hover { background: #f8f8f8; }
    .google-icon { width: 20px; height: 20px; }

    #titleRow { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 16px 0; flex-wrap: wrap; position: relative; z-index: 1; }
    #titleRow h1 { font-size: 24px; margin: 0; user-select: none; }

    #clock { text-align: center; font-size: 48px; font-weight: bold; margin: 10px 0 6px; }
    #clockMode { text-align: center; font-size: 13px; color: #c0392b; margin-bottom: 24px; min-height: 16px; }

    /* ホーム画面のまとまり（申請画面のとき隠す） */
    #homeView.hide { display: none; }

    #buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 16px; position: relative; z-index: 2; }
    .punchBtn { width: 130px; height: 90px; font-size: 20px; color: white; border: none; border-radius: 10px; cursor: pointer; position: relative; }
    .punchBtn.in { background: #2e9e5b; }
    .punchBtn.out { background: #c0392b; }
    .punchBtn.leave { background: #4a3f8f; }
    .punchBtn.back { background: #4a3f8f; }

    #applyButtons { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 30px; }
    .applyBtn { padding: 12px 18px; font-size: 15px; border: none; border-radius: 8px; background: #6b7d8f; color: white; cursor: pointer; }

    #history { max-width: 520px; margin: 0 auto 30px; background: white; border-radius: 10px; padding: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .histHeader { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 12px; gap: 6px; flex-wrap: wrap; }
    .histHeader h2 { font-size: 16px; margin: 0; color: #666; margin-right: auto; }
    .pageBtn { border: none; background: #eef; color: #4a3f8f; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .fixModeBtn { border: none; background: #f0e2c8; color: #7a5a10; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .fixModeBtn.active { background: #e0a83e; color: white; }

    .dayHeading { font-size: 13px; color: #4a3f8f; background: #f0f0fa; padding: 6px 20px; margin-top: 6px; font-weight: bold; }
    .record { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-top: 1px solid #eee; flex-wrap: wrap; }
    .record .label { font-weight: bold; }
    .record .time { color: #666; margin-left: auto; margin-right: 12px; }
    .empty { text-align: center; color: #aaa; padding: 20px; }
    .record.pending { background: #fff9ec; }
    .record .pendingTag { font-size: 11px; color: #b26a00; background: #ffe9c2; border-radius: 4px; padding: 2px 6px; margin-left: 8px; }
    .record.canceled { background: #f4f4f4; color: #aaa; }
    .record.canceled .label { text-decoration: line-through; }
    .record.canceled .time { text-decoration: line-through; }
    .record .canceledTag { font-size: 11px; color: #888; background: #e2e2e2; border-radius: 4px; padding: 2px 6px; margin-left: 8px; }
    .record .editedTag { font-size: 11px; color: #1c6b8c; background: #d3ecf5; border-radius: 4px; padding: 2px 6px; margin-left: 8px; }

    .rowBtn { border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; margin-left: 6px; }
    .rowBtn.confirm { background: #2e9e5b; color: white; }
    .rowBtn.remove { background: #e0e0e0; color: #555; }
    .rowBtn.restore { background: #4a3f8f; color: white; }
    .rowBtn.edit { background: #1c8ca0; color: white; }
    .rowBtn.delete { background: #7a1f1f; color: white; }

    .auditItem { padding: 12px 20px; border-top: 1px solid #eee; }
    .auditItem .auditHead { font-weight: bold; margin-bottom: 6px; }
    .auditItem .auditHead .dim { color: #aaa; font-weight: normal; font-size: 13px; margin-left: 8px; }
    .auditLog { list-style: none; margin: 0; padding: 0; }
    .auditLog li { font-size: 13px; color: #666; padding: 3px 0 3px 14px; border-left: 2px solid #ddd; margin-left: 4px; }
    .auditLog li .logTime { color: #999; margin-right: 8px; }
    .auditItem.deleted .auditHead { color: #7a1f1f; }

    /* 申請履歴（ホーム下部） */
    #appHistory { max-width: 520px; margin: 0 auto 40px; background: white; border-radius: 10px; padding: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    #appHistory h2 { font-size: 16px; text-align: center; color: #666; margin: 6px 0 12px; }
    .appRecord { padding: 12px 20px; border-top: 1px solid #eee; }
    .appRecord .appHead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .appRecord .appType { font-weight: bold; }
    .appRecord .appStatus { font-size: 11px; color: #b26a00; background: #ffe9c2; border-radius: 4px; padding: 2px 8px; }
    .appRecord .appDetail { font-size: 13px; color: #777; margin-top: 6px; line-height: 1.5; }
    .appRecord .appCancel { border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; background: #e0e0e0; color: #555; }
    .appRecord.canceled { background: #f4f4f4; color: #aaa; }
    .appRecord.canceled .appType { text-decoration: line-through; }
    .appRecord.rejected { background: #ffebee; }
    .appRecord.rejected .appType { color: #c62828; }

    /* 申請フォーム画面 */
    #applyView { display: none; max-width: 520px; margin: 0 auto 40px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    #applyView.show { display: block; }
    #applyView h2 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    #applyView .formSub { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .formRow { margin-bottom: 16px; }
    .formRow label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
    .formRow label .req { color: #c0392b; margin-left: 4px; font-size: 12px; }
    .formRow input, .formRow textarea, .formRow select { width: 100%; box-sizing: border-box; font-size: 15px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
    .formRow textarea { min-height: 70px; resize: vertical; }
    .formError { color: #c0392b; font-size: 13px; margin-bottom: 12px; min-height: 16px; }
    .formButtons { display: flex; justify-content: space-between; gap: 12px; }
    .formBackBtn { flex: 1; padding: 12px; font-size: 15px; border: none; border-radius: 8px; background: #e0e0e0; color: #444; cursor: pointer; }
    .formSubmitBtn { flex: 1; padding: 12px; font-size: 15px; border: none; border-radius: 8px; background: #2e9e5b; color: white; cursor: pointer; }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 50; }
    #overlay.show { display: flex; }
    #dialog { background: white; border-radius: 14px; padding: 28px 24px; width: 360px; max-width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.25); text-align: center; }
    #dialog .lead { font-size: 15px; color: #666; margin-bottom: 16px; }
    .compare { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .compare .col { flex: 1; background: #f5f5f5; border-radius: 10px; padding: 12px 8px; }
    .compare .col .caption { font-size: 12px; color: #999; margin-bottom: 4px; }
    .compare .col .value { font-size: 18px; font-weight: bold; }
    .compare .col.now { background: #eaf5ee; }
    .compare .col.now .value { color: #2e9e5b; }
    .compare .col.now.warn { background: #fff6e5; }
    .compare .col.now.warn .value { color: #b26a00; }
    #warnText { font-size: 13px; color: #b26a00; background: #fff6e5; border-radius: 8px; padding: 10px 12px; margin: 12px 0 4px; display: none; text-align: left; line-height: 1.5; }
    #warnText.show { display: block; }
    #confirmQuestion { font-size: 16px; margin: 18px 0 22px; }
    .dialogButtons { display: flex; justify-content: space-between; }
    .dialogButtons.hide { display: none; }
    .cancelBtn { padding: 12px 22px; font-size: 15px; border: none; border-radius: 8px; background: #e0e0e0; color: #444; cursor: pointer; }
    .okBtn { padding: 12px 22px; font-size: 15px; border: none; border-radius: 8px; background: #2e9e5b; color: white; cursor: pointer; }
    .okBtn:disabled { background: #b7d9c3; cursor: not-allowed; }
    #fixButtons { display: none; flex-direction: column; gap: 10px; }
    #fixButtons.show { display: flex; }
    .fixBtn { padding: 14px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
    .fixBtn.primary { background: #2e9e5b; color: white; }
    .fixBtn.secondary { background: #f0e2c8; color: #7a5a10; }
    .fixBtn.ghost { background: #eee; color: #666; }
    #timeInputArea { display: none; }
    #timeInputArea.show { display: block; }
    #timeInputArea .fillLead { font-size: 15px; margin-bottom: 6px; }
    #timeInputArea .fillSub { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.5; }
    #timeInput { font-size: 28px; padding: 8px 12px; border: 2px solid #ccc; border-radius: 8px; text-align: center; }
    #timeInputButtons { display: flex; justify-content: space-between; margin-top: 22px; }
    #deleteArea { display: none; }
    #deleteArea.show { display: block; }
    #deleteArea .delLead { font-size: 16px; margin-bottom: 8px; color: #7a1f1f; font-weight: bold; }
    #deleteArea .delSub { font-size: 13px; color: #888; margin-bottom: 22px; line-height: 1.5; }
    #deleteArea .delButtons { display: flex; justify-content: space-between; }
    .deleteConfirmBtn { padding: 12px 22px; font-size: 15px; border: none; border-radius: 8px; background: #7a1f1f; color: white; cursor: pointer; }

    #settingsPanel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 90; }
    #settingsPanel.show { display: flex; }
    #settingsBox { background: white; border-radius: 14px; padding: 24px; width: 400px; max-width: 92%; max-height: 84vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
    #settingsBox h2 { margin: 0 0 16px; font-size: 20px; text-align: center; }
    .setSection { margin-bottom: 22px; }
    .setSection .setTitle { font-size: 14px; font-weight: bold; color: #4a3f8f; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .nameRow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .nameRow .nameCaption { width: 80px; font-size: 13px; color: #888; }
    .nameRow input { flex: 1; font-size: 14px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
    .toggleRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
    #settingsClose { width: 100%; padding: 12px; font-size: 15px; border: none; border-radius: 8px; background: #2e9e5b; color: white; cursor: pointer; margin-top: 6px; }

    #devPanel { display: none; position: fixed; top: 0; left: 0; width: 350px; height: 100vh; background: #2b2b2b; color: #eee; padding: 14px 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.4); font-size: 14px; z-index: 100; overflow-y: auto; }
    #devPanel.show { display: block; }
    #devPanel .devTitle { font-weight: bold; margin-bottom: 10px; color: #ffca6b; }
    #devPanel .devRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    #devPanel input[type="datetime-local"] { font-size: 14px; padding: 4px 6px; border-radius: 6px; border: none; }
    #devPanel .devBtn { border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #555; color: white; }
    #devPanel .devClose { background: #a33; }
  </style>
</head>
<body>
  <div id="devPanel">
    <div class="devTitle">開発者モード</div>
    <div class="devRow"><label><input type="checkbox" id="devEnable"> 完全削除・完全履歴・承認・却下</label></div>
    <div class="devRow"><label><input type="checkbox" id="useFakeTime"> この時刻に固定</label><input type="datetime-local" id="fakeTimeInput" step="1"></div>
    <div class="devRow"><label><input type="checkbox" id="restartFakeTime"> リスタート（固定した時間から進める）</label></div>
    <div class="devRow"><label><input type="checkbox" id="nightMode"> 夜勤モード（朝4時の自動区切りをしない）</label></div>
    <div class="devRow"><button class="devBtn devClose" id="devCloseBtn">閉じる</button></div>
  </div>

  <!-- ログイン画面 -->
  <div id="loginView">
    <div id="loginBox">
      <h1>打刻アプリ</h1>
      <p class="subtitle" id="loginSubtitle">Googleアカウントでログイン</p>
      <button id="googleLoginBtn">
        <svg class="google-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span id="loginBtnText">Googleでログイン</span>
      </button>
      <p style="font-size: 12px; color: #999; margin-top: 16px; text-align: center;" id="demoNotice"></p>
    </div>
  </div>

  <div id="topBar">
    <div id="userInfo" class="hidden">
      <div id="userAvatar">U</div>
      <div id="userDisplayName">ユーザー名</div>
    </div>
    <span class="spacer"></span>
    <button id="reportBtnTop" style="border: none; background: #f0e2c8; color: #7a5a10; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin-right: 8px;">レポート</button>
    <button id="settingsBtn">設定</button>
    <button id="logoutBtn" class="hidden">ログアウト</button>
  </div>

  <!-- ステータスバー -->
  <div id="statusBar" class="notStarted">
    まだ打刻がありません
  </div>
  <div style="text-align: center; font-size: 13px; color: #666; padding: 4px 0;">
    本日の勤務時間：<span id="todayWorkingHours" style="font-weight: bold; color: #333;">-</span>
  </div>

  <div id="titleRow">
    <h1 id="appTitle">打刻アプリ</h1>
    <span id="devBadge">⚙ 開発者モードON</span>
    <button id="devOffBtn">通常モードに戻す</button>
  </div>

  <div id="clock">00:00:00</div>
  <div id="clockMode"></div>

  <!-- ホーム画面 -->
  <div id="homeView">
    <div id="buttons">
      <button class="punchBtn in"    data-type="出勤" id="btnIn">出勤</button>
      <button class="punchBtn out"   data-type="退勤" id="btnOut">退勤</button>
      <button class="punchBtn leave" data-type="外出" id="btnLeave">外出</button>
      <button class="punchBtn back"  data-type="戻り" id="btnBack">戻り</button>
    </div>

    <div id="applyButtons">
      <button class="applyBtn" id="applyOvertime" data-apply="残業申請">残業申請</button>
      <button class="applyBtn" id="applyHoliday" data-apply="休日出勤">休日出勤</button>
      <button class="applyBtn" id="applyLeave" data-apply="休暇申請">休暇申請</button>
    </div>

    <div id="history">
      <div class="histHeader">
        <h2 id="histTitle">本日の打刻</h2>
        <button class="fixModeBtn" id="fixModeBtn">打刻を修正</button>
        <button class="pageBtn" id="pageBtn">全履歴 ▶</button>
      </div>
      <div id="records"><div class="empty">まだ打刻がありません</div></div>
    </div>

    <div id="appHistory">
      <h2>申請の履歴</h2>
      <div id="appRecords"><div class="empty">まだ申請がありません</div></div>
    </div>
  </div>

  <!-- 申請フォーム画面 -->
  <div id="applyView">
    <h2 id="applyFormTitle">申請</h2>
    <div class="formSub" id="applyFormSub">必要事項を入力してください</div>
    <div id="formFields"></div>
    <div class="formError" id="formError"></div>
    <div class="formButtons">
      <button class="formBackBtn" id="formBackBtn">戻る</button>
      <button class="formSubmitBtn" id="formSubmitBtn">申請する</button>
    </div>
  </div>

  <!-- レポート画面 -->
  <div id="reportView">
    <h2 style="text-align: center; margin-top: 0;">レポート</h2>

    <!-- レポートタイプ選択 -->
    <div style="text-align: center; margin: 12px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
      <button class="reportTypeBtn active" data-type="working" style="padding: 8px 14px; background: #4a3f8f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">勤務時間</button>
      <button class="reportTypeBtn" data-type="overtime" style="padding: 8px 14px; background: #e0e0e0; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">残業</button>
      <button class="reportTypeBtn" data-type="paid_leave" style="padding: 8px 14px; background: #e0e0e0; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">有給</button>
      <button class="reportTypeBtn" data-type="holiday_work" style="padding: 8px 14px; background: #e0e0e0; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">休日出勤</button>
    </div>

    <div style="text-align: center; margin: 16px; padding: 16px; background: white; border-radius: 10px;">
      <div style="margin-bottom: 12px;">
        <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #666;">対象月：</label>
        <input type="month" id="reportMonth" style="padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; width: 180px;">
      </div>
      <button id="reportBtn" style="padding: 10px 20px; background: #4a3f8f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">レポート表示</button>
    </div>
    <div id="reportTable" style="max-width: 520px; margin: 16px auto; background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 16px; min-height: 200px;">

    function pad(n) { return String(n).padStart(2, "0"); }
    function formatClock(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()); }
    function formatDate(date) { return date.getFullYear() + "/" + pad(date.getMonth() + 1) + "/" + pad(date.getDate()); }
    function isoDate(date) { return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()); }
    function businessDay(date) {
      const d = new Date(date);
      if (!nightMode.checked && d.getHours() < 4) { d.setDate(d.getDate() - 1); }
      return formatDate(d);
    }
    function displayName(type) { return names[type] || type; }
    function addLog(item, text) {
      const now = getNow();
      item.log.push({ at: formatDate(now) + " " + formatClock(now), text: text });
    }

    function tickClock() {
      const now = getNow();
      clock.textContent = formatClock(now);
      if (timeMode === TimeMode.FIXED) {
        clockMode.textContent = "⚙ 手動時刻: " + formatDate(now) + "（固定中）";
      } else if (timeMode === TimeMode.ADVANCING) {
        clockMode.textContent = "⚙ 手動時刻: " + formatDate(now) + "（進行中）";
      } else {
        clockMode.textContent = "";
      }
    }
    setInterval(tickClock, 1000);
    tickClock();

    // ===== 日付変更時の自動更新（朝4時のリセット） =====
    let lastBusinessDay = businessDay(getNow());
    setInterval(function() {
      const today = businessDay(getNow());

        page = 0;  // 本日ページに戻す

        } else {

      formError.textContent = "";

      // 定義を読んで入力欄を組み立てる
      formFields.innerHTML = "";
      for (const field of def.fields) {
        const row = document.createElement("div");
        row.className = "formRow";
        const label = document.createElement("label");
        label.textContent = field.label;
        if (field.required) {
          const req = document.createElement("span");
          req.className = "req"; req.textContent = "必須";
          label.appendChild(req);
        }
        row.appendChild(label);

        let input;
        if (field.type === "textarea") {
          input = document.createElement("textarea");
        } else {
          input = document.createElement("input");
          input.type = field.type;
        }
        if (field.placeholder) input.placeholder = field.placeholder;
        input.id = "field_" + field.key;
        // 日付欄は今日を初期値に
        if (field.type === "date") input.value = isoDate(getNow());
        row.appendChild(input);
        formFields.appendChild(row);
      }

      // ホームを隠して申請画面へ
      homeView.classList.add("hide");
      applyView.classList.add("show");
    }

    function closeApplyForm() {
      applyView.classList.remove("show");
      homeView.classList.remove("hide");
      currentApplyType = null;
    }

    // 申請を確定
    function submitApply() {
      const def = applyDefs[currentApplyType];
      const values = {};
      // 入力を集める＋必須チェック
      for (const field of def.fields) {
        const el = document.getElementById("field_" + field.key);
        const v = el.value.trim();
        if (field.required && v === "") {
          formError.textContent = "「" + field.label + "」は必須です。";
          return;
        }
        values[field.key] = v;
      }
      // 申請を記録
      const now = getNow();

      // 日付形式を YYYY/MM/DD に統一
      if (values.date) {
        const [year, month, day] = values.date.split("-");
        values.date = `${year}/${month}/${day}`;
      }

      applications.push({
        type: currentApplyType,
        def: def,
        values: values,
        submittedAt: formatDate(now) + " " + formatClock(now),
        canceled: false,
        rejected: false,
        approved: false
      });
      renderApplications();
      renderApplications();
      closeApplyForm();
    }

    function makeRow(item, index) {
      let cls = "record";
      if (item.pending) cls += " pending";
      if (item.canceled) cls += " canceled";
      const row = document.createElement("div");
      row.className = cls;
      const label = document.createElement("span");
      label.className = "label"; label.textContent = displayName(item.type);
      row.appendChild(label);
      if (item.pending && !item.canceled) { const t = document.createElement("span"); t.className = "pendingTag"; t.textContent = "申請中"; row.appendChild(t); }
      if (!item.pending && !item.canceled && devMode) { const t = document.createElement("span"); t.className = "approvedTag"; t.textContent = "✓承認済み"; t.style.cssText = "background: #4caf50; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-left: 4px;"; row.appendChild(t); }
      if (item.edited && !item.canceled) { const t = document.createElement("span"); t.className = "editedTag"; t.textContent = "修正済み"; row.appendChild(t); }
      if (item.canceled) { const t = document.createElement("span"); t.className = "canceledTag"; t.textContent = "取消済み"; row.appendChild(t); }
      const time = document.createElement("span");
      time.className = "time"; time.textContent = item.time; row.appendChild(time);
      if (fixMode && !item.canceled) {
        const editBtn = document.createElement("button");
        editBtn.className = "rowBtn edit"; editBtn.textContent = "編集";
        editBtn.addEventListener("click", function () { openEdit(index); });
        row.appendChild(editBtn);
      }
      if (devMode && item.pending && !item.canceled) {
        const confirmBtn = document.createElement("button");
        confirmBtn.className = "rowBtn confirm"; confirmBtn.textContent = "承認";
        confirmBtn.addEventListener("click", function () { openPunchApproveConfirm(index, item); });
        row.appendChild(confirmBtn);
      }
      if (!item.canceled) {
        const removeBtn = document.createElement("button");
        removeBtn.className = "rowBtn remove"; removeBtn.textContent = "取消";
        removeBtn.addEventListener("click", function () {
          openCancelConfirm(index, item);
        });
        row.appendChild(removeBtn);
      } else {
        const restoreBtn = document.createElement("button");
        restoreBtn.className = "rowBtn restore"; restoreBtn.textContent = "復元";
        restoreBtn.addEventListener("click", function () {
          item.canceled = false;
          addLog(item, "復元");
          if (item.docId && isFirebaseConfigured && currentUser && db) {
            db.collection("users").doc(currentUser.uid)
              .collection("punches").doc(item.docId)
              .update({ canceled: false })
              .catch((error) => console.error("Firestore更新エラー:", error));
          }
          renderHistory();
        });
        row.appendChild(restoreBtn);
        if (devMode) {
          const delBtn = document.createElement("button");
          delBtn.className = "rowBtn delete"; delBtn.textContent = "完全削除";
          delBtn.addEventListener("click", function () { openDelete(index); });
          row.appendChild(delBtn);
        }
      }
      return row;
    }

    function makeAuditItem(item, deleted) {

      const head = document.createElement("div");
      head.className = "auditHead";
      head.innerHTML = displayName(item.type) + " " + item.time +
        '<span class="dim">' + item.day + (deleted ? " ・完全削除済み" : "") + '</span>';
      box.appendChild(head);
      const ul = document.createElement("ul");
      ul.className = "auditLog";
      for (const entry of item.log) {
        const li = document.createElement("li");
        li.innerHTML = '<span class="logTime">' + entry.at + '</span>' + entry.text;
        ul.appendChild(li);
      }
      box.appendChild(ul);
      return box;
    }

    function makeApplicationItem(app, appIndex) {
      const row = document.createElement("div");
      row.className = "historyRow";
      row.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; margin: 4px 0;";

      const typeColors = { "残業申請": "#ff9800", "有給申請": "#2196f3", "休日出勤申請": "#4caf50" };
      const color = typeColors[app.type] || "#666";
      const statusText = app.approved ? "✓承認済" : (app.canceled ? "✕却下" : "申請中");
      const statusColor = app.approved ? "green" : (app.canceled ? "red" : "#ff9800");

      const content = Object.values(app.values).filter(v => v).join(" / ") || "-";

      // 左側のコンテンツ
      const leftDiv = document.createElement("div");
      leftDiv.style.cssText = "flex: 1;";
      leftDiv.innerHTML = `
        <strong style="color: ${color};">${app.type}</strong> ${app.values.date}<br>
        <span style="font-size: 12px; color: #666;">${content}</span><br>
        <span style="font-size: 11px; color: #999;">${app.submittedAt}</span>
      `;
      row.appendChild(leftDiv);

      // ステータス表示
      const statusSpan = document.createElement("span");
      statusSpan.style.cssText = `color: ${statusColor}; font-weight: bold; margin-right: 12px; min-width: 60px; text-align: right;`;
      statusSpan.textContent = statusText;
      row.appendChild(statusSpan);

      // ボタン
      if (!app.approved && !app.canceled) {
        const approveBtn = document.createElement("button");
        approveBtn.style.cssText = "padding: 4px 8px; margin: 0 2px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;";
        approveBtn.textContent = "承認";
        approveBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          applications[appIndex].approved = true;
          renderHistory();
        });
        row.appendChild(approveBtn);

        const rejectBtn = document.createElement("button");
        rejectBtn.style.cssText = "padding: 4px 8px; margin: 0 2px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;";
        rejectBtn.textContent = "却下";
        rejectBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          applications[appIndex].canceled = true;

      return row;
    }

    function updateStatusBar() {
      const state = currentState();
      statusBar.textContent = state;
      statusBar.className = "";

      if (state === "勤務中") {
        statusBar.classList.add("working");
      } else if (state === "外出中") {
        statusBar.classList.add("away");
      } else if (state === "退勤済み") {
        statusBar.classList.add("done");
      } else {
        statusBar.classList.add("notStarted");
      }

      // 本日の勤務時間を表示
      const today = businessDay(getNow());
      const workingHours = calculateDailyWorkingHours(today, history);
      document.getElementById("todayWorkingHours").textContent = formatWorkingHours(workingHours);
    }

    function renderHistory() {
      if (page === 2 && !devMode) { page = 1; }

      // ビュー表示制御
      homeView.classList.toggle("hide", page === 3);
      document.getElementById("reportView").style.display = page === 3 ? "block" : "none";

      // レポートボタンのテキスト変更
      const reportBtnTop = document.getElementById("reportBtnTop");
      if (page === 3) {
        reportBtnTop.textContent = "ホームに戻る";
        return;
      } else {
        reportBtnTop.textContent = "レポート";
      }  // レポートページの場合はここで終了

      if (page === 0) { histTitle.textContent = "本日の打刻"; pageBtn.textContent = "全履歴 ▶"; }
      else if (page === 1) { histTitle.textContent = "全履歴"; pageBtn.textContent = devMode ? "完全履歴 ▶" : "◀ 本日"; }
      else { histTitle.textContent = "完全履歴（監査ログ）"; pageBtn.textContent = "◀ 本日"; }
      records.innerHTML = "";
      if (page === 2) {
        if (history.length === 0 && deletedLog.length === 0) { records.innerHTML = '<div class="empty">記録がありません</div>'; return; }

        // 監査ログ
        const auditHead = document.createElement("div");
        auditHead.style.cssText = "font-weight: bold; padding: 12px 0 8px; border-top: 2px solid #ddd; margin-top: 12px;";
        auditHead.textContent = "監査ログ";
        records.appendChild(auditHead);
        for (let i = 0; i < history.length; i++) { records.appendChild(makeAuditItem(history[i], false)); }
        for (let i = 0; i < deletedLog.length; i++) { records.appendChild(makeAuditItem(deletedLog[i], true)); }

        return;
      }
      if (history.length === 0) { records.innerHTML = '<div class="empty">まだ打刻がありません</div>'; updateStatusBar(); return; }
      if (page === 0) {
        const today = businessDay(getNow());
        let count = 0;
        for (let i = 0; i < history.length; i++) { if (history[i].day === today) { records.appendChild(makeRow(history[i], i)); count++; } }
        if (count === 0) { records.innerHTML = '<div class="empty">本日の打刻はまだありません</div>'; }
      } else {
        // 全履歴は新しい順に表示（逆順ループ）
        let lastDay = null;
        for (let i = history.length - 1; i >= 0; i--) {
          const item = history[i];
          if (item.day !== lastDay) {
            const heading = document.createElement("div");
            heading.className = "dayHeading"; heading.textContent = item.day;
            records.appendChild(heading);

            // その日の勤務時間を表示
            const workingHours = calculateDailyWorkingHours(item.day, history);
            const hoursDiv = document.createElement("div");
            hoursDiv.style.cssText = "text-align: center; font-size: 12px; color: #999; padding: 2px 0 6px; border-bottom: 1px solid #eee;";
            hoursDiv.textContent = "勤務時間：" + formatWorkingHours(workingHours);
            records.appendChild(hoursDiv);

            lastDay = item.day;
          }
          records.appendChild(makeRow(item, i));
        }
      }
      updateStatusBar();
    }

    function currentState() {
      const today = businessDay(getNow());
      let last = null;
      let latestTime = null;
      for (let i = 0; i < history.length; i++) {
        if (!history[i].canceled && history[i].day === today) {
          if (latestTime === null || history[i].time > latestTime) {
            last = history[i].type;
            latestTime = history[i].time;
          }
        }
      }
      if (last === null) return "未出勤";
      if (last === "出勤") return "勤務中";
      if (last === "戻り") return "勤務中";
      if (last === "外出") return "外出中";
      if (last === "退勤") return "退勤済み";
      return "勤務中";
    }

    function checkConflict(type) {
      const state = currentState();
      const N = displayName;
      if (type === "出勤") {
        if (state === "勤務中" || state === "外出中")
          return { message: "すでに" + N("出勤") + "済みのようです。もう一度" + N("出勤") + "を打つ必要はないかもしれません。", fillType: null };
        return null;
      }
      if (type === "退勤") {
        if (state === "未出勤")
          return { message: "まだ" + N("出勤") + "の打刻がないようです。先に" + N("出勤") + "を打ち忘れていませんか？", fillType: "出勤", fillLabel: "先に「" + N("出勤") + "」を補ってから" + N("退勤") + "する" };
        if (state === "外出中")
          return { message: N("外出") + "中のまま" + N("退勤") + "しようとしています。先に「" + N("戻り") + "」を打ち忘れていませんか？", fillType: "戻り", fillLabel: "先に「" + N("戻り") + "」を補ってから" + N("退勤") + "する" };
        if (state === "退勤済み")
          return { message: "すでに" + N("退勤") + "済みのようです。", fillType: null };
        return null;
      }
      if (type === "外出") {
        if (state === "未出勤")
          return { message: "まだ" + N("出勤") + "の打刻がないようです。先に" + N("出勤") + "を打ち忘れていませんか？", fillType: "出勤", fillLabel: "先に「" + N("出勤") + "」を補ってから" + N("外出") + "する" };
        if (state === "外出中")
          return { message: "すでに" + N("外出") + "中のようです。", fillType: null };
        if (state === "退勤済み")
          return { message: N("退勤") + "済みですが、" + N("外出") + "しますか？", fillType: null };
        return null;
      }
      if (type === "戻り") {
        if (state !== "外出中")
          return { message: N("外出") + "の打刻がないようです。先に「" + N("外出") + "」を打ち忘れていませんか？", fillType: "外出", fillLabel: "先に「" + N("外出") + "」を補ってから" + N("戻り") + "する" };
        return null;
      }
      return null;
    }

    function showArea(which) {
      confirmArea.style.display = (which === "confirm") ? "block" : "none";
      timeInputArea.classList.toggle("show", which === "time");
      deleteArea.classList.toggle("show", which === "delete");
    }

    function makePunch(type, time, day, pendingFlag, editedFlag, firstLogText) {
      const item = { type: type, time: time, pending: pendingFlag, day: day, canceled: false, edited: editedFlag, log: [] };
      addLog(item, firstLogText);
      return item;
    }

    // 勤務時間を計算（時刻のみを比較）
    function calculateDailyWorkingHours(date, allHistory) {
      const dayData = allHistory.filter(h => h.day === date && !h.canceled);
      if (dayData.length === 0) return null;

      let checkInTime = null, checkOutTime = null;
      const outTimes = [], returnTimes = [];

      for (const item of dayData) {
        if (item.type === "出勤") checkInTime = item.time;
        else if (item.type === "退勤") checkOutTime = item.time;
        else if (item.type === "外出") outTimes.push(item.time);
        else if (item.type === "戻り") returnTimes.push(item.time);
      }

      if (!checkInTime || !checkOutTime) return null;

      const timeToMinutes = (timeStr) => {
        const [h, m] = timeStr.split(":").map(Number);
        return h * 60 + m;
      };

      let workingMinutes = timeToMinutes(checkOutTime) - timeToMinutes(checkInTime);
      for (let i = 0; i < outTimes.length; i++) {
        const breakTime = timeToMinutes(returnTimes[i] || checkOutTime) - timeToMinutes(outTimes[i]);
        workingMinutes -= breakTime;
      }

      const hours = Math.floor(workingMinutes / 60);
      const minutes = workingMinutes % 60;
      return { hours, minutes, totalMinutes: workingMinutes };
    }

    // 時間をHH:MM形式で表示
    function formatWorkingHours(result) {
      if (!result) return "-";
      return `${result.hours}:${pad(result.minutes)}`;
    }

    // 月別レポート生成
    function generateMonthlyReport(year, month) {
      const monthStr = `${year}/${pad(month)}`;
      const monthData = history.filter(h => h.day.startsWith(monthStr) && !h.canceled);

      if (monthData.length === 0) {
        return { days: [], totalMinutes: 0 };
      }

      const dayMap = {};
      for (const item of monthData) {
        if (!dayMap[item.day]) {
          dayMap[item.day] = [];
        }
        dayMap[item.day].push(item);
      }

      const days = Object.keys(dayMap).sort().reverse();
      let totalMinutes = 0;

      const result = days.map(day => {
        const dayItems = dayMap[day];
        const workingHours = calculateDailyWorkingHours(day, dayItems);
        if (workingHours) {
          totalMinutes += workingHours.totalMinutes;
        }
        const checkIn = dayItems.find(i => i.type === "出勤")?.time || "-";
        const checkOut = dayItems.find(i => i.type === "退勤")?.time || "-";
        return { day, checkIn, checkOut, workingHours };
      });

      return { days: result, totalMinutes };
    }

    // CSV エクスポート
    function exportToCSV(year, month) {

      const lines = [

        "",
        "日付,出勤,退勤,勤務時間"

      for (const day of report.days) {
        const hours = formatWorkingHours(day.workingHours);
        lines.push(`${day.day},${day.checkIn},${day.checkOut},${hours}`);
      }

      const totalHours = Math.floor(report.totalMinutes / 60);
      const totalMins = report.totalMinutes % 60;
      lines.push("");
      lines.push(`合計,,,${totalHours}:${pad(totalMins)}`);

      const csv = lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `punch_report_${year}_${pad(month)}.csv`;
      link.click();

    // 申請レポート生成
    function generateApplicationReport(type, year, month) {
      const monthStr = `${year}/${pad(month)}`;
      const typeMap = { "overtime": "残業申請", "paid_leave": "有給申請", "holiday_work": "休日出勤申請" };
      const typeLabel = typeMap[type];

      const filtered = applications.filter(app =>
        app.type === typeLabel && app.values && app.values.date && app.values.date.startsWith(monthStr) && !app.canceled
      );

      return filtered.sort((a, b) => b.values.date.localeCompare(a.values.date));
    }

    // 申請レポート表示
    function displayApplicationReport(type, year, month) {
      const report = generateApplicationReport(type, year, month);
      const table = document.getElementById("reportTable");
      const typeMap = { "overtime": "残業申請", "paid_leave": "有給申請", "holiday_work": "休日出勤申請" };
      const typeLabel = typeMap[type];

      if (report.length === 0) {
        table.innerHTML = `<div style="text-align: center; color: #999; padding: 20px;">この月の${typeLabel}がありません</div>`;
        return;
      }

      let html = `<div style="font-size: 14px;"><strong>${year}年${month}月の${typeLabel}</strong></div><table style="width: 100%; border-collapse: collapse; margin-top: 12px;">
        <tr style="border-bottom: 2px solid #ddd;">
          <th style="padding: 8px; text-align: left;">日付</th>
          <th style="padding: 8px; text-align: left;">内容</th>
          <th style="padding: 8px; text-align: center;">ステータス</th>
        </tr>`;

      let approvedCount = 0;
      for (const app of report) {
        const content = Object.values(app.values).filter(v => v).join(" / ") || "-";
        const statusText = app.approved ? "✓承認済" : "申請中";
        const statusColor = app.approved ? "#4caf50" : "#ff9800";
        if (app.approved) approvedCount++;

        html += `<tr style="border-bottom: 1px solid #eee;">
          <td style="padding: 8px;">${app.values.date}</td>
          <td style="padding: 8px;">${content}</td>
          <td style="padding: 8px; text-align: center; color: ${statusColor}; font-weight: bold;">${statusText}</td>
        </tr>`;
      }

      const pendingCount = report.length - approvedCount;
      html += `<tr style="background: #f5f5f5; border-top: 2px solid #ddd;">
        <td colspan="3" style="padding: 8px; text-align: right;">申請中：${pendingCount}件 / 承認済：${approvedCount}件 / 合計：${report.length}件</td>
      </tr>`;

      html += "</table>";
      table.innerHTML = html;
    }

    // 申請データを CSV エクスポート
    function exportApplicationsToCSV(type, year, month) {
      const report = generateApplicationReport(type, year, month);
      const typeMap = { "overtime": "残業申請", "paid_leave": "有給申請", "holiday_work": "休日出勤申請" };
      const typeLabel = typeMap[type];

      const lines = [
        `${typeLabel} ${year}年${month}月`,
        "",
        "日付,内容,ステータス"
      ];

      let approvedCount = 0;
      for (const app of report) {
        const content = Object.values(app.values).filter(v => v).join(" / ") || "-";
        const statusText = app.approved ? "承認済" : "申請中";
        if (app.approved) approvedCount++;
        lines.push(`${app.values.date},${content},${statusText}`);
      }

      const pendingCount = report.length - approvedCount;
      lines.push("");
      lines.push(`申請中,${pendingCount}件`);
      lines.push(`承認済,${approvedCount}件`);
      lines.push(`合計,${report.length}件`);

      const csv = lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");

    function savePunchToFirestore(type, time, day) {
      // Firestore未設定またはログインしていない場合はスキップ
      if (!isFirebaseConfigured || !currentUser || !db) {
        return Promise.resolve();
      }

      const timestamp = getNow();
      return db.collection("users").doc(currentUser.uid)
        .collection("punches").add({
          type: type,
          time: time,
          date: day,
          timestamp: firebase.firestore.Timestamp.fromDate(timestamp),
          createdAt: firebase.firestore.Timestamp.fromDate(timestamp)
        })
        .catch((error) => {
          console.error("Firestore保存エラー:", error);
          // デモモード時は警告を表示しない
          if (isFirebaseConfigured) {
            alert("データ保存に失敗しました。インターネット接続を確認してください。");
          }
        });
    }

    function confirmPunch() {
      if (currentUIState !== UIState.PUNCH_CONFIRM || !uiData.pendingPunch) return;
      const pending = uiData.pendingPunch;
      const item = makePunch(pending.type, pending.time, pending.day, false, false, "作成（" + pending.time + "）");
      history.push(item);
      savePunchToFirestore(pending.type, pending.time, pending.day);
      renderHistory(); closeConfirm();
    }

    function fixFill() {
      if (!uiData.pendingPunch || !fillType) return;
      editIndex = null;
      fillLeadText.textContent = "補う打刻の時刻を入力";
      fillSubText.textContent = "「" + displayName(uiData.pendingPunch.type) + " " + uiData.pendingPunch.time + "」はそのまま記録します。先に補う「" + displayName(fillType) + "」の正しい時刻を入れてください。";
      const now = getNow();
      timeInput.value = pad(now.getHours()) + ":" + pad(now.getMinutes());
      setUIState(UIState.PUNCH_EDIT, { fillType: fillType, pendingPunch: uiData.pendingPunch });
    }

    function fillBack() {
      if (editIndex !== null) {
        closeConfirm();
      } else if (uiData.pendingPunch) {
        setUIState(UIState.PUNCH_CONFIRM, { pendingPunch: uiData.pendingPunch });
        leadText.textContent = "打刻の順番が普段と違うようです";
        normalButtons.classList.add("hide");
        fixButtons.classList.add("show");
      }
    }

    function fillDone() {
      if (!timeInput.value) return;
      const newTime = timeInput.value + ":00";
      if (editIndex !== null) {
        const item = history[editIndex];
        if (item.time !== newTime) {
          const oldTime = item.time;
          item.time = newTime;
          item.edited = true;
          item.pending = true;
          addLog(item, "時刻を " + oldTime + " → " + newTime + " に修正（申請中）");

          // 修正内容をFirestoreに保存
          if (item.docId && isFirebaseConfigured && currentUser && db) {
            db.collection("users").doc(currentUser.uid)
              .collection("punches").doc(item.docId)
              .update({
                time: newTime,
                edited: true,
                pending: true
              })
              .catch((error) => console.error("Firestore更新エラー:", error));
          }
        }
        editIndex = null;
        renderHistory(); closeConfirm(); return;
      }
      if (!uiData.pendingPunch || !fillType) return;
      const savedPending = uiData.pendingPunch;
      const fillItem = makePunch(fillType, newTime, savedPending.day, true, false, "補完として作成（" + newTime + "・申請中）");
      const mainItem = makePunch(savedPending.type, savedPending.time, savedPending.day, false, false, "作成（" + savedPending.time + "）");
      history.push(fillItem);
      history.push(mainItem);
      savePunchToFirestore(fillType, newTime, savedPending.day);
      savePunchToFirestore(savedPending.type, savedPending.time, savedPending.day);
      renderHistory();

      // 補完打刻は既に Firestore に保存済みなので、そのまま終了
      pending = null;
      fillType = null;
      closeConfirm();
    }

      // テキストボックスが手動で変更されたら、その時刻に固定
      if (useFakeTime.checked && fakeTimeInput.value) {
        fixedTime = new Date(fakeTimeInput.value);
        timeMode = TimeMode.FIXED;
        timeOffset = 0;
        restartFakeTime.checked = false;
        tickClock();
        refreshDevUI();
      }
    });

    restartFakeTime.addEventListener("change", function () {
      if (restartFakeTime.checked) {
        // チェック → リスタート（固定時刻から時間進行開始）
        if (useFakeTime.checked && fixedTime) {
          const baseTime = fixedTime;
          const realNow = new Date();
          timeOffset = baseTime.getTime() - realNow.getTime();
          timeMode = TimeMode.ADVANCING;

          // UIのチェックボックスは固定を外す
          useFakeTime.checked = false;

          tickClock();
        }
      } else {
        // チェック外す → リアルタイムに戻す
        timeMode = TimeMode.REAL;
        fixedTime = null;
        timeOffset = 0;
        useFakeTime.checked = false;
        tickClock();
      }
      refreshDevUI();
    });
    nightMode.addEventListener("change", function () { renderHistory(); });

    // ===== 認証処理 =====
    function showLoginView() {
      setUIState(UIState.LOGIN);
      userInfo.classList.add("hidden");
      logoutBtn.classList.add("hidden");
    }

    function showHomeView() {
      setUIState(UIState.HOME);
      userInfo.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
    }

    function updateUserUI(user) {
      if (user) {
        const displayName = user.displayName || user.email || "ユーザー";
        userDisplayName.textContent = displayName;
        const initial = displayName.charAt(0).toUpperCase();
        userAvatar.textContent = initial;
        showHomeView();
      } else {
        showLoginView();
      }
    }

    // Googleでログイン
    function loginWithGoogle() {
      if (!auth) {
        // Firebase未設定の場合、デモユーザーでログイン
        currentUser = {
          uid: "demo_user_" + Date.now(),
          displayName: "デモユーザー",
          email: "demo@example.com"
        };
        updateUserUI(currentUser);
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          currentUser = result.user;
          updateUserUI(currentUser);
        })
        .catch((error) => {
          console.error("ログインエラー:", error);
          alert("ログインに失敗しました: " + error.message);
        });
    }

    // ログアウト
    function logout() {
      if (!auth) return;
      auth.signOut()
        .then(() => {
          currentUser = null;
          updateUserUI(null);
          history.length = 0;
          applications.length = 0;
          renderHistory();
          renderApplications();
        })
        .catch((error) => {
          console.error("ログアウトエラー:", error);
        });
    }

    function loadAllPunchesFromFirestore() {
      // Firestore未設定の場合はローカルデータのみで動作
      if (!isFirebaseConfigured || !currentUser || !db) {
        renderHistory();
        return;
      }

      // 既存のリスナーがあれば削除
      if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
      }

      // リアルタイムリスナーを設定（全期間のデータを古い順に取得）
      firestoreUnsubscribe = db.collection("users").doc(currentUser.uid)
        .collection("punches")
        .orderBy("timestamp", "asc")  // 古い順（currentState()が最新状態を正しく判定できる）
        .onSnapshot(
          (snapshot) => {
            // ローカル履歴を更新
            history.length = 0;
            snapshot.forEach((doc) => {
              const data = doc.data();
              const item = makePunch(data.type, data.time, data.date, data.pending || false, data.edited || false, "Firestoreから読み込み");
              item.docId = doc.id;
              // Firestoreのフラグがあれば反映
              if (data.canceled !== undefined) {
                item.canceled = data.canceled;
              }
              if (data.edited !== undefined) {
                item.edited = data.edited;
              }
              if (data.pending !== undefined) {
                item.pending = data.pending;
              }
              history.push(item);
            });
            // 本日のデータを表示するため、page = 0 にリセット
            page = 0;
            renderHistory();
          },
          (error) => {
            console.error("Firestoreリスナーエラー:", error);
            // エラー時でもローカルデータで表示を続ける
            renderHistory();
          }
        );
    }

    // 認証状態の変化を監視
    if (isFirebaseConfigured) {
      auth.onAuthStateChanged((user) => {
        currentUser = user;
        updateUserUI(user);

        if (user) {
          // ログイン時：Firestoreから今日のデータを読み込み
          loadAllPunchesFromFirestore();
        } else {
          // ログアウト時：リスナーを削除
          if (firestoreUnsubscribe) {
            firestoreUnsubscribe();
            firestoreUnsubscribe = null;
          }
        }
      });
    } else {
      // Firebase未設定の場合、デモモードで動作
      showHomeView();
    }

    // イベントリスナー
    googleLoginBtn.addEventListener("click", loginWithGoogle);
    logoutBtn.addEventListener("click", logout);
  </script>
</body>
</html>
